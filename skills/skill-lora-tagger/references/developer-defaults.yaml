# Developer defaults for the current two-step workflow.
# These values support the implementation and are not meant to be a large user config surface.

paths:
  output_dir_name: dataset

images:
  supported_extensions:
    - .jpg
    - .jpeg
    - .png
    - .webp
    - .heic
  output_jpeg_quality: 95
  rename_pattern: "image_{index:04d}"
  alignment: 64

resolutions:
  supported_long_edges:
    - 1024
    - 1280
    - 1536
  ratio_warn_threshold: 0.03

vision_upload:
  long_edge: 896
  jpeg_quality: 80
  transport: data_url

captioning:
  primary_base_url: https://hk.n1n.ai/v1
  fallback_base_url: https://api.n1n.ai/v1
  model: qwen3.5-122b-a10b
  api_key_env: N1N_API_KEY
  concurrency: 15
  timeout_seconds: 60
  max_retries: 5
  temperature: 0.1
  top_p: 1.0
  max_tokens: 512

caption_assembly:
  separator: ". "
  keep_subject_first: true
