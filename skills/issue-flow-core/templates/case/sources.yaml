case_id: "{{case_id}}"
created_at: "{{timestamp}}"
sources:
  # User-provided issue materials
  - id: "{{source_id}}"
    origin: issue_material
    kind: "{{kind}}"  # path, archive, url, note, media
    location: "{{location}}"
    collected: "{{collected_path}}"  # path in curated/ or 'skipped'
    note: "{{note}}"
    
  # Repository evidence
  - id: "{{source_id}}"
    origin: repository
    kind: "{{kind}}"  # file, symbol, line_range
    location: "{{location}}"
    note: "{{note}}"

# Mutation log (collect may modify issue-material roots: extraction, renaming, etc.)
mutations:
  - timestamp: "{{timestamp}}"
    action: "{{action}}"  # extracted, renamed, created, rewritten
    target: "{{target}}"
    reason: "{{reason}}"
